<!DOCTYPE html>
<html>
<head>
  <title>Something went wrong — PodiumCircle</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { --gold:#a9761f; --ink:#15161a; --muted:#767a82; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:Georgia,"Times New Roman",serif; color:var(--ink); background:#f8f6f1; text-align:center; padding:24px; box-sizing:border-box; }
    .wrap { max-width:480px; }
    .brand { font-weight:700; letter-spacing:0; font-size:19px; margin-bottom:48px; font-family:Arial,Helvetica,sans-serif; }
    .brand span { color:var(--gold); }
    .code { color:var(--gold); font-weight:800; letter-spacing:.16em; font-size:12px; text-transform:uppercase; font-family:Arial,Helvetica,sans-serif; margin-bottom:18px; }
    h1 { font-size:38px; line-height:1.2; margin:0 0 16px; }
    p { color:var(--muted); line-height:1.6; font-family:Arial,Helvetica,sans-serif; font-size:15px; margin:0 0 28px; }
    a { display:inline-block; background:var(--gold); color:white; padding:13px 24px; font-weight:700; text-decoration:none; border-radius:2px; font-family:Arial,Helvetica,sans-serif; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">PODIUM<span>CIRCLE</span></div>
    <div class="code">500 error</div>
    <h1>Something went wrong on our end.</h1>
    <p>We've been notified and are looking into it. Please try again in a few minutes.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
